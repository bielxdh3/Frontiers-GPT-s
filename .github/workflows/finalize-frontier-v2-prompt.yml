name: Finalize Frontier V2 prompt

on:
  push:
    paths:
      - .github/workflows/finalize-frontier-v2-prompt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact uploaded prompt
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmarks/solar-system/prompts
          cat .import/frontier-v2.part*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > benchmarks/solar-system/prompts/frontier-v2.md

      - name: Verify byte-for-byte integrity
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="7c2833a0486938c38671139807bd4a8c16371c3740175376ad02a6c0c3c06d65"
          EXPECTED_BYTES="115983"
          EXPECTED_LINES="1153"

          FILE="benchmarks/solar-system/prompts/frontier-v2.md"
          ACTUAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          ACTUAL_BYTES="$(wc -c < "$FILE" | tr -d ' ')"
          ACTUAL_LINES="$(wc -l < "$FILE" | tr -d ' ')"

          echo "SHA-256: $ACTUAL_SHA"
          echo "Bytes:   $ACTUAL_BYTES"
          echo "Lines:   $ACTUAL_LINES"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_LINES" = "$EXPECTED_LINES"

      - name: Remove transport chunks
        shell: bash
        run: |
          rm .import/frontier-v2.part*.b64
          rmdir .import 2>/dev/null || true

      - name: Commit exact prompt archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .import benchmarks/solar-system/prompts/frontier-v2.md
          git commit -m "Archive exact Frontier V2 Solar System prompt"
          git push
