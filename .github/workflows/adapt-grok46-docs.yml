name: Adapt Grok 4.6 benchmark docs

on:
  push:
    branches:
      - add-grok-4.6-solar-system
    paths:
      - .github/workflows/adapt-grok46-docs.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-grok-4.6-solar-system
          fetch-depth: 0

      - name: Adapt documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          archive = '5d77eeb509e147e40701fa7a72d7009c1a81ed3eca8f0c992d3dd6fa454cd1aa'

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise RuntimeError(f'{label}: pattern not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # Machine-readable provenance
          p = Path('benchmarks/solar-system/RUNS.json')
          data = json.loads(p.read_text())
          data['schema_version'] = 4
          if not any(r.get('id') == 'grok-4.6-frontier-v2' for r in data['runs']):
              data['runs'].append({
                  'id': 'grok-4.6-frontier-v2',
                  'model': 'Grok 4.6',
                  'role': 'frontier-run',
                  'source_commit': None,
                  'source_archive_sha256': archive,
                  'source_archive_bytes': 122173,
                  'source_filename': 'grok-4.6-solar-system-main.zip',
                  'prompt': 'prompts/frontier-v2.md',
                  'target_path': 'runs/grok-4.6/frontier-v2',
                  'status': 'imported',
                  'notes': 'Uses the exact shared Frontier V2 prompt. The supplied ZIP contained no Git metadata, so provenance is pinned by the verified source-archive SHA-256 instead of an invented source commit.',
                  'archive_status': 'self-contained'
              })
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Root README
          replace_once('README.md', 'runs-3%20snapshots%20archived', 'runs-4%20snapshots%20archived', 'run badge')
          replace_once('README.md', '**Exact prompts. Exact commits. Complete project snapshots. Explicit evidence. No hidden benchmark contamination.**', '**Exact prompts. Pinned provenance. Complete project snapshots. Explicit evidence. No hidden benchmark contamination.**', 'tagline')
          replace_once('README.md', '<sub>Direct Frontier V2 comparison — same master prompt.</sub>', '<sub>Direct Frontier V2 arena — Sun Max, Astra Max and Grok 4.6 use the same master prompt. Live links are shown where a deployment exists.</sub>', 'live subtitle')
          p = Path('README.md')
          s = p.read_text().replace('<td width="33%" valign="top">', '<td width="25%" valign="top">', 3)
          p.write_text(s)
          replace_once('README.md', '**Snapshot:** `fca2ef51b4…`\n\n</td>\n</tr>\n</table>', '**Snapshot:** `fca2ef51b4…`\n\n</td>\n<td width="25%" valign="top">\n\n### 𝕏 Grok 4.6\n**Frontier V2 challenger**\n\nA third direct challenger generated from the same Frontier V2 input.\n\n- Complete supplied project archived\n- Same exact shared V2 prompt\n- Source ZIP integrity pinned by SHA-256\n- No source commit fabricated: the supplied archive contained no `.git` metadata\n\n**Source archive:** `5d77eeb509…`\n\n</td>\n</tr>\n</table>', 'Grok arena card')
          replace_once('README.md', '                     exact same Frontier V2 prompt\n                    ↙                             ↘\n       GPT-5.6 Sun Max                     GPT-6 Astra Max\n              rebuild                         challenger', '                         exact same Frontier V2 prompt\n                    ↙                ↓                ↘\n       GPT-5.6 Sun Max       GPT-6 Astra Max         Grok 4.6\n              rebuild             challenger          challenger', 'comparison diagram')
          replace_once('README.md', '| Used by | GPT-5.6 Sun Max rebuild + GPT-6 Astra Max |', '| Used by | GPT-5.6 Sun Max rebuild + GPT-6 Astra Max + Grok 4.6 |', 'prompt consumers')
          replace_once('README.md', '        │   │   └── rebuild/          ← immutable vendored snapshot\n        │   └── gpt-6-astra-max/\n        │       └── frontier-v2/      ← immutable vendored snapshot', '        │   │   └── rebuild/          ← immutable vendored snapshot\n        │   ├── gpt-6-astra-max/\n        │   │   └── frontier-v2/      ← immutable vendored snapshot\n        │   └── grok-4.6/\n        │       └── frontier-v2/      ← immutable vendored snapshot', 'repository tree')
          replace_once('README.md', '| **Exact commit SHA** | freezes the output being judged |', '| **Pinned source provenance** | freezes the output via Git commit when available, or a verified source-archive hash when Git metadata is absent |', 'run integrity')
          replace_once('README.md', '| Astra Max snapshot | ✅ imported — `fca2ef51…` |', '| Astra Max snapshot | ✅ imported — `fca2ef51…` |\n| Grok 4.6 snapshot | ✅ imported — source archive SHA-256 `5d77eeb509…` |', 'status')
          replace_once('README.md', 'Those legacy GitHub repositories are not required for browsing, evaluating, preserving, or extending this benchmark and may be removed without affecting the copies stored here. The public `biel.dev.br` experiences are presentation links, not archive dependencies.', 'Those legacy GitHub repositories are not required for browsing, evaluating, preserving, or extending this benchmark and may be removed without affecting the copies stored here. The public `biel.dev.br` experiences are presentation links, not archive dependencies.\n\nThe Grok 4.6 run was supplied directly as a ZIP without `.git` metadata. Its verified source-archive SHA-256 is therefore the provenance anchor; the repository does not invent a commit SHA that was never supplied.', 'provenance note')

          # Benchmark README
          replace_once('benchmarks/solar-system/README.md', '<sub>Direct Frontier V2 comparison — same master prompt.</sub>', '<sub>Direct Frontier V2 arena — Sun Max, Astra Max and Grok 4.6 use the same master prompt. Live links are shown where a deployment exists.</sub>', 'benchmark subtitle')
          astra_row = '| **Frontier V2 challenger** | GPT-6 Astra Max | [`frontier-v2.md`](./prompts/frontier-v2.md) | `fca2ef51b4…` | Same V2 input, different frontier model |'
          replace_once('benchmarks/solar-system/README.md', astra_row, astra_row + '\n| **Frontier V2 challenger** | Grok 4.6 | [`frontier-v2.md`](./prompts/frontier-v2.md) | source archive `5d77eeb509…` | Same V2 input, different frontier model |', 'benchmark run row')
          replace_once('benchmarks/solar-system/README.md', 'All three project snapshots and both benchmark prompt versions are now archived in this repository.', 'All four project snapshots and both benchmark prompt versions are now archived in this repository.', 'benchmark count')
          replace_once('benchmarks/solar-system/README.md', 'The direct Sun-rebuild-vs-Astra comparison uses the exact same `frontier-v2.md` input.', 'The direct Sun-rebuild-vs-Astra-vs-Grok comparison uses the exact same `frontier-v2.md` input.', 'shared input')
          astra_prov = 'The source commit imported into this hub is `fca2ef51b43dc1c7a91050fca3476dc6fbf7d3f5`.'
          grok_section = astra_prov + '\n\n## Grok 4.6 challenger snapshot\n\nThe Grok 4.6 run is a complete Vite/TypeScript Solar System project with its own rendering engine, orbital/science core, catalogs, learning content, localization, state and persistence layers. It is archived exactly from the supplied project ZIP.\n\nThe supplied ZIP contained no `.git` directory, so no upstream source commit can be proven. Rather than fabricate one, this archive pins the supplied source itself with SHA-256 `' + archive + '`.'
          replace_once('benchmarks/solar-system/README.md', astra_prov, grok_section, 'Grok benchmark section')
          replace_once('benchmarks/solar-system/README.md', '2. **Sun Rebuild ↔ Astra Max:** model comparison under the exact same Frontier V2 prompt.', '2. **Sun Rebuild ↔ Astra Max ↔ Grok 4.6:** model comparison under the exact same Frontier V2 prompt.', 'comparison list')
          replace_once('benchmarks/solar-system/README.md', '└─ gpt-6-astra-max/\n   └─ frontier-v2/', '├─ gpt-6-astra-max/\n│  └─ frontier-v2/\n└─ grok-4.6/\n   └─ frontier-v2/', 'benchmark tree')
          replace_once('benchmarks/solar-system/README.md', '- exact upstream commit SHA;', '- pinned source provenance (upstream commit SHA when available; verified archive SHA-256 otherwise);', 'reproducibility')
          replace_once('benchmarks/solar-system/README.md', 'The legacy repository names and commit SHAs are retained only to document where each snapshot originated.', 'Legacy repository names and commit SHAs are retained where available; archive hashes are used when the supplied source has no Git metadata.', 'self-contained provenance')

          # Scorecard
          replace_once('benchmarks/solar-system/comparison/SCORECARD.md', 'all three project snapshots', 'all four project snapshots', 'scorecard count')
          astra_score = '| GPT-6 Astra Max | `fca2ef51…` | [`frontier-v2.md`](../prompts/frontier-v2.md) | Ready for evaluation |'
          replace_once('benchmarks/solar-system/comparison/SCORECARD.md', astra_score, astra_score + '\n| Grok 4.6 | archive `5d77eeb509…` | [`frontier-v2.md`](../prompts/frontier-v2.md) | Ready for evaluation |', 'scorecard row')
          replace_once('benchmarks/solar-system/comparison/SCORECARD.md', 'The two Frontier V2 runs use the same archived prompt.', 'The three Frontier V2 runs use the same archived prompt.', 'scorecard V2 count')
          p = Path('benchmarks/solar-system/comparison/SCORECARD.md')
          lines = p.read_text().splitlines()
          inside = False
          out = []
          for line in lines:
              if line == '## Weighted score':
                  inside = True
                  out.append(line)
                  continue
              if line == '## Evidence checklist':
                  inside = False
              if inside and line.startswith('|'):
                  if line.startswith('| Dimension |'):
                      line = line[:-1] + ' Grok 4.6 |'
                  elif line.startswith('| --- |'):
                      line = line[:-1] + ' ---: |'
                  elif line.count('|') >= 5:
                      line = line[:-1] + ' — |'
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          replace_once('benchmarks/solar-system/comparison/SCORECARD.md', '## Final ranking', '### Grok 4.6\n**Strengths:** pending evaluation\n\n**Weaknesses:** pending evaluation\n\n**Critical defects:** pending evaluation\n\n## Final ranking', 'Grok verdict')

          # Prompt archive
          replace_once('benchmarks/solar-system/prompts/README.md', '| [`frontier-v2.md`](./frontier-v2.md) | GPT-5.6 Sun Max — rebuild; GPT-6 Astra Max |', '| [`frontier-v2.md`](./frontier-v2.md) | GPT-5.6 Sun Max — rebuild; GPT-6 Astra Max; Grok 4.6 |', 'prompt table')
          replace_once('benchmarks/solar-system/prompts/README.md', '| Consumers | Sun Max rebuild + Astra Max challenger |', '| Consumers | Sun Max rebuild + Astra Max challenger + Grok 4.6 challenger |', 'prompt consumers')
          replace_once('benchmarks/solar-system/prompts/README.md', '                         exact same Frontier V2 prompt\n                       ↙                               ↘\n          GPT-5.6 Sun Max rebuild              GPT-6 Astra Max', '                            exact same Frontier V2 prompt\n                       ↙                 ↓                 ↘\n          GPT-5.6 Sun Max rebuild      GPT-6 Astra Max         Grok 4.6', 'prompt diagram')

          # Repository architecture
          replace_once('docs/REPOSITORY-ARCHITECTURE.md', '      │  └─ gpt-6-astra-max/\n      │     └─ frontier-v2/', '      │  ├─ gpt-6-astra-max/\n      │  │  └─ frontier-v2/\n      │  └─ grok-4.6/\n      │     └─ frontier-v2/', 'architecture tree')
          replace_once('docs/REPOSITORY-ARCHITECTURE.md', 'A run folder is a self-contained vendored copy of the model output captured from a pinned historical commit.', 'A run folder is a self-contained vendored copy of the model output captured from pinned source provenance: a Git commit when available, or a verified source archive when Git metadata is absent.', 'architecture source rule')
          replace_once('docs/REPOSITORY-ARCHITECTURE.md', '`RUNS.json` records the legacy source repository name and commit as historical provenance, alongside the model label, role, prompt reference and local archived path.', '`RUNS.json` records the strongest verifiable source provenance available — repository/commit when supplied, or source-archive SHA-256 when Git metadata is absent — alongside the model label, role, prompt reference and local archived path.', 'architecture provenance')

          # Final assertions
          assert 'Grok 4.6' in Path('README.md').read_text()
          assert 'Grok 4.6' in Path('benchmarks/solar-system/README.md').read_text()
          assert 'Grok 4.6' in Path('benchmarks/solar-system/comparison/SCORECARD.md').read_text()
          assert 'Grok 4.6' in Path('benchmarks/solar-system/prompts/README.md').read_text()
          assert 'grok-4.6' in Path('docs/REPOSITORY-ARCHITECTURE.md').read_text()
          assert archive in Path('benchmarks/solar-system/RUNS.json').read_text()
          PY

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/adapt-grok46-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Grok 4.6 to Frontier V2 benchmark metadata"
          git push origin HEAD:add-grok-4.6-solar-system
