name: Import Solar System snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-solar-system-snapshots.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned GPT-5.6 Sun Max snapshots
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="https://github.com/bielxdh3/GPT5.6-SUN-MAX-SOLAR-SYSTEM.git"
          ORIGINAL="67eb9fc51feb40ba4befddefde904bf6a6306016"
          REBUILD="93d43ae62f615a37672c0d1936912160d0475ca1"

          clone_commit() {
            local sha="$1"
            local temp="$2"
            rm -rf "$temp"
            git init -q "$temp"
            git -C "$temp" remote add origin "$SOURCE"
            git -C "$temp" fetch -q --depth=1 origin "$sha"
            git -C "$temp" checkout -q --detach FETCH_HEAD
          }

          clone_commit "$ORIGINAL" /tmp/sun-original
          clone_commit "$REBUILD" /tmp/sun-rebuild

          rm -rf benchmarks/solar-system/runs/gpt-5.6-sun-max/original
          rm -rf benchmarks/solar-system/runs/gpt-5.6-sun-max/rebuild
          mkdir -p benchmarks/solar-system/runs/gpt-5.6-sun-max/original
          mkdir -p benchmarks/solar-system/runs/gpt-5.6-sun-max/rebuild

          rsync -a --exclude='.git' /tmp/sun-original/ benchmarks/solar-system/runs/gpt-5.6-sun-max/original/
          rsync -a --exclude='.git' /tmp/sun-rebuild/ benchmarks/solar-system/runs/gpt-5.6-sun-max/rebuild/

      - name: Import Astra snapshot when upstream has a commit
        shell: bash
        run: |
          set -euo pipefail
          ASTRA="https://github.com/bielxdh3/GPT6-ASTRA-MAX-SOLAR-SYSTEM.git"
          HEAD_SHA="$(git ls-remote "$ASTRA" refs/heads/main | awk '{print $1}')"

          if [ -z "$HEAD_SHA" ]; then
            echo "Astra upstream is still empty; leaving its run absent."
            exit 0
          fi

          rm -rf /tmp/astra
          git clone -q --depth=1 "$ASTRA" /tmp/astra
          rm -rf benchmarks/solar-system/runs/gpt-6-astra-max/frontier-v2
          mkdir -p benchmarks/solar-system/runs/gpt-6-astra-max/frontier-v2
          rsync -a --exclude='.git' /tmp/astra/ benchmarks/solar-system/runs/gpt-6-astra-max/frontier-v2/

          python - "$HEAD_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path('benchmarks/solar-system/RUNS.json')
          data = json.loads(path.read_text())
          for run in data['runs']:
              if run['id'] == 'gpt-6-astra-max-frontier-v2':
                  run['source_commit'] = sys.argv[1]
                  run['status'] = 'imported'
                  run['notes'] = 'Vendored from the pinned upstream main commit recorded here.'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Mark pinned Sun snapshots imported
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          path = Path('benchmarks/solar-system/RUNS.json')
          data = json.loads(path.read_text())
          for run in data['runs']:
              if run['id'] in {'gpt-5.6-sun-max-original', 'gpt-5.6-sun-max-frontier-v2'}:
                  run['status'] = 'imported'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit vendored snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/solar-system/runs benchmarks/solar-system/RUNS.json

          if git diff --cached --quiet; then
            echo "Snapshots already match the pinned upstream commits."
            exit 0
          fi

          git commit -m "Import pinned Solar System benchmark runs"
          git push
