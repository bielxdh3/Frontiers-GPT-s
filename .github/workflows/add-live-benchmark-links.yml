name: Add live benchmark links

on:
  push:
    paths:
      - .github/workflows/add-live-benchmark-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add live experience links
        shell: python
        run: |
          from pathlib import Path

          live_block = '''\n## Live experiences\n\n<div align="center">\n\n### ⚔️ Main benchmark\n\n<a href="https://gpt-5.6-sun-v2.biel.dev.br"><strong>☀️ Open GPT-5.6 Sun Max — V2</strong></a>\n&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;\n<a href="https://gpt-6-astra.biel.dev.br"><strong>✦ Open GPT-6 Astra Max</strong></a>\n\n<sub>Direct Frontier V2 comparison — same master prompt.</sub>\n\n</div>\n\n<details>\n<summary>Historical first version</summary>\n\nThe original GPT-5.6 Sun Max build is preserved only as the historical baseline:  \n[GPT-5.6 Sun Max — V1](https://gpt-5.6-sun-v1.biel.dev.br)\n\n</details>\n'''

          root = Path('README.md')
          text = root.read_text()
          marker = '[Explore the first benchmark](./benchmarks/solar-system) · [Read the methodology](./docs/METHODOLOGY.md) · [See the architecture](./docs/REPOSITORY-ARCHITECTURE.md)\n\n</div>\n\n---'
          replacement = '[Explore the first benchmark](./benchmarks/solar-system) · [Read the methodology](./docs/METHODOLOGY.md) · [See the architecture](./docs/REPOSITORY-ARCHITECTURE.md)\n\n</div>\n' + live_block + '\n---'
          if 'https://gpt-5.6-sun-v2.biel.dev.br' not in text:
              if marker not in text:
                  raise SystemExit('Root README insertion marker not found')
              text = text.replace(marker, replacement, 1)
              root.write_text(text)

          bench = Path('benchmarks/solar-system/README.md')
          text = bench.read_text()
          marker = '</div>\n\n---'
          if 'https://gpt-5.6-sun-v2.biel.dev.br' not in text:
              if marker not in text:
                  raise SystemExit('Benchmark README insertion marker not found')
              text = text.replace(marker, '</div>\n' + live_block + '\n---', 1)
              bench.write_text(text)

      - name: Commit links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmarks/solar-system/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add live Solar System benchmark links"
          git push
