    <text x="370" y="451" font-size="16" font-weight="700">Fable 5.1</text><text x="370" y="474" font-size="13" font-weight="500" fill="#4B5563">Max</text>
    <text x="570" y="451" font-size="16" font-weight="700">Sun Max V2</text><text x="570" y="474" font-size="13" font-weight="500" fill="#4B5563">GPT-5.6</text>
    <text x="770" y="451" font-size="16" font-weight="700">Grok 4.6</text><text x="770" y="474" font-size="13" font-weight="500" fill="#4B5563">XHIGH</text>
