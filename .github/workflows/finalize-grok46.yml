name: Finalize Grok 4.6 snapshot

on:
  push:
    branches:
      - add-grok-4.6-solar-system
    paths:
      - .github/workflows/finalize-grok46.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-grok-4.6-solar-system
          fetch-depth: 0

      - name: Restore missing files
        shell: bash
        run: |
          set -euo pipefail
          cat .grok-final/part-00.b64 .grok-final/rem-*.b64 > /tmp/grok-missing.b64
          echo "6e00a199a3a2a3ba6f3f6378ed13d80438d95380dcaa4aafbbe2a1897ed8445e  /tmp/grok-missing.b64" | sha256sum -c -
          base64 -d /tmp/grok-missing.b64 > /tmp/grok-missing.tgz
          echo "851c5298ed25664c591bcfe4e35fc96065a54b3a2d5c422d59603263015141a7  /tmp/grok-missing.tgz" | sha256sum -c -
          tar -xzf /tmp/grok-missing.tgz -C benchmarks/solar-system/runs/grok-4.6/frontier-v2

      - name: Verify exact files
        shell: bash
        run: |
          set -euo pipefail
          cd benchmarks/solar-system/runs/grok-4.6/frontier-v2
          sha256sum -c "$GITHUB_WORKSPACE/.grok-final/expected.sha256"

      - name: Test and build
        working-directory: benchmarks/solar-system/runs/grok-4.6/frontier-v2
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit exact snapshot and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf benchmarks/solar-system/runs/grok-4.6/frontier-v2/node_modules
          rm -rf benchmarks/solar-system/runs/grok-4.6/frontier-v2/dist
          rm -rf benchmarks/solar-system/runs/grok-4.6/frontier-v2/tmp
          rm -rf .grok-final
          rm -f .github/workflows/finalize-grok46.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Grok 4.6 Solar System snapshot"
          git push origin HEAD:add-grok-4.6-solar-system
