<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Frontier V2 scores</title>
  <desc id="desc">Bar chart from zero to one hundred. Astra Max 95.25, Fable 5.1 Max 93.3, Sun Max V2 71.2, Grok 4.6 XHIGH 33.8.</desc>
  <rect width="900" height="520" fill="#ffffff" rx="16"/>
  <g font-family="Segoe UI, Arial, sans-serif">
