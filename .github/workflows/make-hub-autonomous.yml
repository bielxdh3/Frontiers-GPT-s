name: Make benchmark hub autonomous

on:
  push:
    paths:
      - .github/workflows/make-hub-autonomous.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove external repository dependency
        shell: python
        run: |
          from pathlib import Path
          import json

          runs_path = Path('benchmarks/solar-system/RUNS.json')
          data = json.loads(runs_path.read_text())
          data['schema_version'] = 3
          data['repository_mode'] = 'self-contained'
          data['external_source_dependency'] = False
          for run in data['runs']:
              if 'source_repository' in run:
                  run['legacy_source_repository'] = run.pop('source_repository')
              run['archive_status'] = 'self-contained'
          runs_path.write_text(json.dumps(data, indent=2) + '\n')

          root = Path('README.md')
          text = root.read_text()
          old = '''## Reproducible snapshot import pipeline\n\nThe hub includes a GitHub Actions workflow that can rebuild the vendored run archive from pinned upstream commits. This avoids turning old repositories into permanent navigation dependencies while preserving provenance.\n\nFor the current Solar System archive, the workflow successfully imported both Sun snapshots and detected/imported the Astra main snapshot in the same run.\n'''
          new = '''## Self-contained archive\n\n**Frontiers GPTs is now fully self-contained.** Every Solar System prompt and every evaluated project snapshot required by this benchmark is stored directly in this repository. There are no submodules, import jobs, runtime fetches, or repository-to-repository dependencies.\n\nThe original repository names and commit SHAs are retained only as historical provenance. Deleting those legacy repositories does not remove or alter the archived benchmark runs here.\n'''
          if old not in text:
              raise SystemExit('Root import-pipeline section not found')
          text = text.replace(old, new, 1)
          old = '''## Legacy upstreams\n\nThe first runs originated in dedicated repositories before the unified archive existed. They remain useful as provenance sources, but **Frontiers GPTs is the canonical benchmark hub going forward**.\n\nA historical ChatGPT-hosted preview also existed for the original Sun run. Its long-term availability is not assumed; the Git snapshot is the durable record.\n'''
          new = '''## Historical provenance\n\nThe first runs originally lived in dedicated repositories before this unified archive existed. Their names and pinned commit SHAs are preserved in `RUNS.json` only as historical provenance; **Frontiers GPTs is the canonical and complete archive**.\n\nThose legacy GitHub repositories are not required for browsing, evaluating, preserving, or extending this benchmark and may be removed without affecting the copies stored here. The public `biel.dev.br` experiences are presentation links, not archive dependencies.\n'''
          if old not in text:
              raise SystemExit('Root legacy section not found')
          root.write_text(text.replace(old, new, 1))

          bench = Path('benchmarks/solar-system/README.md')
          text = bench.read_text()
          marker = '''Evaluator material lives separately in `comparison/`.\n'''
          addition = '''Evaluator material lives separately in `comparison/`.\n\n### Self-contained archive\n\nThese run folders are complete vendored snapshots stored directly in `Frontiers-GPT-s`. They are not submodules and do not fetch content from the original repositories. The legacy repository names and commit SHAs are retained only to document where each snapshot originated.\n'''
          if marker not in text:
              raise SystemExit('Benchmark snapshot marker not found')
          bench.write_text(text.replace(marker, addition, 1))

          arch = Path('docs/REPOSITORY-ARCHITECTURE.md')
          text = arch.read_text()
          text = text.replace(
              'A run folder is a vendored copy of the model output at a pinned upstream commit. Evaluator-authored notes do not belong inside that snapshot. This keeps the boundary between **what the model produced** and **what the evaluator concluded** obvious.',
              'A run folder is a self-contained vendored copy of the model output captured from a pinned historical commit. It does not depend on the original repository continuing to exist. Evaluator-authored notes do not belong inside that snapshot. This keeps the boundary between **what the model produced** and **what the evaluator concluded** obvious.'
          )
          text = text.replace(
              '`RUNS.json` records the upstream repository, commit, model label, role and prompt reference for every imported run. A human-readable explanation lives in the benchmark README.',
              '`RUNS.json` records the legacy source repository name and commit as historical provenance, alongside the model label, role, prompt reference and local archived path. These provenance fields are descriptive only: no benchmark operation depends on those repositories. A human-readable explanation lives in the benchmark README.'
          )
          arch.write_text(text)

          method = Path('docs/METHODOLOGY.md')
          text = method.read_text()
          text = text.replace(
              '- preserve source commit IDs;\n',
              '- preserve historical source commit IDs while keeping the archived run self-contained;\n'
          )
          method.write_text(text)

      - name: Remove obsolete workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-solar-system-snapshots.yml
          rm -f .github/workflows/make-hub-autonomous.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Frontiers GPTs fully self-contained"
          git push
