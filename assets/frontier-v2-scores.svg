<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Frontier V2 scores</title>
  <desc id="desc">Bar chart from zero to one hundred. Astra Max 95.25, Fable 5.1 Max 93.3, Sun Max V2 71.2, Grok 4.6 XHIGH 33.8.</desc>
  <rect width="900" height="520" fill="#ffffff" rx="16"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Frontier V2 — Scores / 100</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Scale starts at 0</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="72" y1="420" x2="860" y2="420"/>
    <line x1="72" y1="356" x2="860" y2="356"/>
    <line x1="72" y1="292" x2="860" y2="292"/>
    <line x1="72" y1="228" x2="860" y2="228"/>
    <line x1="72" y1="164" x2="860" y2="164"/>
    <line x1="72" y1="100" x2="860" y2="100"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="end">
    <text x="62" y="424">0</text>
    <text x="62" y="360">20</text>
    <text x="62" y="296">40</text>
    <text x="62" y="232">60</text>
    <text x="62" y="168">80</text>
    <text x="62" y="104">100</text>
  </g>

  <line x1="72" y1="100" x2="72" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="72" y1="420" x2="860" y2="420" stroke="#6b7280" stroke-width="1.5"/>

  <g>
    <rect x="110" y="115.2" width="120" height="304.8" fill="#7c3aed" rx="4"/>
    <rect x="310" y="121.44" width="120" height="298.56" fill="#f97316" rx="4"/>
    <rect x="510" y="192.16" width="120" height="227.84" fill="#fbbf24" rx="4"/>
    <rect x="710" y="311.84" width="120" height="108.16" fill="#111827" rx="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="170" y="105">95.25</text>
    <text x="370" y="111">93.30</text>
    <text x="570" y="182">71.20</text>
    <text x="770" y="302">33.80</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle">
    <text x="170" y="448" font-weight="700">Astra Max</text>
    <text x="170" y="468">GPT-6</text>
    <text x="370" y="448" font-weight="700">Fable 5.1</text>
    <text x="370" y="468">Max</text>
    <text x="570" y="448" font-weight="700">Sun Max V2</text>
    <text x="570" y="468">GPT-5.6</text>
    <text x="770" y="448" font-weight="700">Grok 4.6</text>
    <text x="770" y="468">XHIGH</text>
  </g>
